# Local development profile: persistent file-based H2 database in ./data/
spring.datasource.url=jdbc:h2:file:./data/localservicedb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Enable demo data seeding for quick local evaluation
app.seed-demo-data=true
