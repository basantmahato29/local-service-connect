spring.application.name=local-service-connect
server.port=8080

# Profile: defaults to 'local' (H2 persistent database) or set SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}


# JWT (use a long random secret in production, via an environment variable)
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-of-at-least-32-chars}
app.jwt.expiration-ms=86400000

# Default admin, created on first start (Phase 2)
app.admin.email=admin@localserviceconnect.com
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# Seed realistic demo data for Indian home services
app.seed-demo-data=${SEED_DEMO_DATA:true}

# Quick Service configuration
app.quick-service.target-minutes=10
app.quick-service.unassigned-threshold-minutes=5
app.quick-service.arrival-delay-threshold-minutes=20
app.quick-service.alert-cooldown-minutes=30

# Service-start OTP verification configuration
app.otp.expiration-minutes=10
app.otp.max-attempts=5
app.otp.lockout-minutes=15

# Optional SMS Gateway configuration (e.g. twilio, msg91, or none)
app.sms.provider=${SMS_PROVIDER:none}
app.sms.api-key=${SMS_API_KEY:}
app.sms.sender-id=${SMS_SENDER_ID:LSCSRV}

# Google Maps API Configuration
app.google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
app.google.maps.default-center-lat=${MAPS_DEFAULT_LAT:23.3441}
app.google.maps.default-center-lng=${MAPS_DEFAULT_LNG:85.3096}
app.google.maps.default-zoom=${MAPS_DEFAULT_ZOOM:12}

# Support up to 10MB request body for image uploads
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


