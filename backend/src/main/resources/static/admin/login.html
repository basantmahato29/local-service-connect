<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login · Local Service Connect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="auth-page-wrapper">
<div class="card auth-card" style="max-width: 480px;">
  <div class="card-body p-4 p-md-5">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <a href="/" class="brand h4 mb-0 text-decoration-none">Local Service Connect</a>
      <span class="badge bg-danger-subtle text-danger border border-danger-subtle badge-role px-2 py-1">
        <i class="bi bi-shield-lock me-1"></i>Admin
      </span>
    </div>
    <p class="text-muted mb-4">Sign in to the administrative management console</p>

    <div id="sessionNotice" class="alert alert-warning d-none py-2 px-3 small">
      <i class="bi bi-info-circle-fill me-1"></i>
      <span id="sessionNoticeText"></span>
    </div>

    <div id="err" class="alert alert-danger d-none py-2 px-3 small"></div>

    <div class="p-3 mb-3 rounded-3 bg-light border border-dashed">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="small fw-bold text-dark"><i class="bi bi-key-fill text-warning me-1"></i>Quick Test Credentials</span>
        <span class="badge text-bg-secondary">Local Demo</span>
      </div>
      <div class="small text-muted mb-2">
        Email: <code>admin@localserviceconnect.com</code><br>
        Password: <code>Admin@12345</code>
      </div>
      <button type="button" id="quickLoginBtn" class="btn btn-danger btn-sm w-100 fw-semibold">
        <i class="bi bi-lightning-charge-fill me-1"></i> 1-Click Fill &amp; Sign In
      </button>
    </div>

    <form id="f">
      <div class="mb-3">
        <label class="form-label" for="email">Admin Email</label>
        <input id="email" type="email" class="form-control" value="admin@localserviceconnect.com" required autocomplete="email">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" class="form-control" placeholder="Admin@12345" required autocomplete="current-password">
      </div>
      <button id="btn" type="submit" class="btn btn-primary w-100 py-2">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign in as Admin
      </button>
    </form>

    <div class="text-center mt-3 pt-2 border-top">
      <a href="/" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Homepage</a>
    </div>
  </div>
</div>
</div>

<script src="/js/api.js"></script>
<script>
const urlParams = new URLSearchParams(location.search);
const redirectParam = urlParams.get('redirect');
const currentUser = Auth.get();

if (currentUser && currentUser.token) {
  const notice = document.getElementById('sessionNotice');
  const noticeText = document.getElementById('sessionNoticeText');
  if (currentUser.role === 'ADMIN') {
    noticeText.innerHTML = `You are already signed in as <strong>${esc(currentUser.name || 'Admin')}</strong>. <a href="/admin/dashboard.html" class="fw-bold text-decoration-underline">Go to Admin Dashboard &rarr;</a>`;
    notice.classList.remove('d-none');
    notice.className = 'alert alert-success py-2 px-3 small';
  } else {
    noticeText.innerHTML = `Currently signed in as <strong>${esc(currentUser.name || currentUser.role)}</strong> (${currentUser.role}). Signing in here will switch to an Admin session.`;
    notice.classList.remove('d-none');
  }
}

async function doLogin(email, password) {
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  const quickBtn = document.getElementById('quickLoginBtn');
  err.classList.add('d-none');
  btn.disabled = true;
  quickBtn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span> Signing in...';

  try {
    const d = await api('/auth/login', {
      method: 'POST',
      body: { email: email.trim(), password: password }
    });

    if (d.role !== 'ADMIN') {
      throw new Error('Access denied. The account "' + email + '" is not an Administrator.');
    }

    Auth.save(d);
    location.href = redirectParam ? decodeURIComponent(redirectParam) : '/admin/dashboard.html';
  } catch (ex) {
    showError(err, ex.message);
    btn.disabled = false;
    quickBtn.disabled = false;
    btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign in as Admin';
  }
}

document.getElementById('quickLoginBtn').addEventListener('click', () => {
  document.getElementById('email').value = 'admin@localserviceconnect.com';
  document.getElementById('password').value = 'Admin@12345';
  doLogin('admin@localserviceconnect.com', 'Admin@12345');
});

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const emailVal = document.getElementById('email').value.trim();
  const passVal = document.getElementById('password').value;
  doLogin(emailVal, passVal);
});
</script>
</body>
</html>
