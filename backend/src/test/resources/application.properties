spring.application.name=local-service-connect-test

# In-memory H2 database with MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT Secret
app.jwt.secret=test-secret-key-that-is-at-least-32-chars-long!
app.jwt.expiration-ms=86400000

# Test Admin Account (matches SecurityTest.java)
app.admin.email=admin@test.com
app.admin.password=Admin@12345
app.quick-service.target-minutes=10
