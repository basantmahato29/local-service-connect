<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Moderation · Local Service Connect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container-xl py-4 py-lg-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
      <div>
        <h1 class="h3 fw-bold mb-1">Review &amp; Rating Moderation</h1>
        <p class="text-muted mb-0">Oversee customer feedback, inspect quality ratings, and remove inappropriate or abusive reviews.</p>
      </div>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <div class="input-group input-group-sm" style="width: 240px;">
          <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
          <input type="text" id="search" class="form-control" placeholder="Search customer, provider, comment...">
        </div>
        <select id="ratingFilter" class="form-select form-select-sm w-auto">
          <option value="">All Star Ratings</option>
          <option value="5">5 Stars (Excellent)</option>
          <option value="4">4 Stars (Good)</option>
          <option value="3">3 Stars (Average)</option>
          <option value="2">2 Stars (Poor)</option>
          <option value="1">1 Star (Critical)</option>
        </select>
        <button id="refreshBtn" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-clockwise me-1"></i> Refresh
        </button>
      </div>
    </div>

    <div id="msg" class="alert d-none"></div>

    <!-- Stats row -->
    <div class="row g-3 mb-4" id="statsRow">
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm dashboard-card p-3">
          <div class="small text-muted">Total Reviews</div>
          <div class="fs-4 fw-bold text-dark" id="statTotal">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm dashboard-card p-3">
          <div class="small text-muted">Average Rating</div>
          <div class="fs-4 fw-bold text-warning" id="statAvg">
            <span id="statAvgVal">-</span> <small class="fs-6 text-muted">/ 5.0</small>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm dashboard-card p-3">
          <div class="small text-muted">5-Star Feedback</div>
          <div class="fs-4 fw-bold text-success" id="statFive">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm dashboard-card p-3">
          <div class="small text-muted">Critical (1-2 Stars)</div>
          <div class="fs-4 fw-bold text-danger" id="statCritical">-</div>
        </div>
      </div>
    </div>

    <!-- Review List Table -->
    <div class="card border-0 shadow-sm dashboard-card overflow-hidden">
      <div class="table-responsive">
        <table class="table align-middle mb-0 table-hover">
          <thead class="table-light">
            <tr>
              <th style="width: 14%;">Rating</th>
              <th style="width: 38%;">Customer Review &amp; Feedback</th>
              <th style="width: 22%;">Provider</th>
              <th style="width: 14%;">Customer &amp; Date</th>
              <th class="text-end" style="width: 12%;">Action</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="5" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading reviews...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    const me = Auth.require('ADMIN');
    adminNav('reviews');
    const $ = id => document.getElementById(id);

    let allReviews = [];

    function msg(t, ok = false) {
      const m = $('msg');
      m.className = 'alert alert-' + (ok ? 'success' : 'danger') + ' alert-dismissible fade show';
      m.innerHTML = `${t} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
      m.classList.remove('d-none');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function load() {
      try {
        allReviews = await api('/admin/reviews') || [];
        updateStats();
        render();
      } catch (e) {
        msg(e.message);
      }
    }

    function updateStats() {
      const total = allReviews.length;
      let sum = 0;
      let fiveCount = 0;
      let critCount = 0;

      allReviews.forEach(r => {
        const val = Number(r.rating) || 0;
        sum += val;
        if (val === 5) fiveCount++;
        if (val <= 2) critCount++;
      });

      const avg = total > 0 ? (sum / total).toFixed(1) : '0.0';

      $('statTotal').textContent = total;
      $('statAvgVal').textContent = avg;
      $('statFive').textContent = fiveCount;
      $('statCritical').textContent = critCount;
    }

    function renderStars(r) {
      let h = '<span class="text-warning text-nowrap">';
      for (let i = 1; i <= 5; i++) {
        h += i <= r ? '<i class="bi bi-star-fill"></i>' : '<i class="bi bi-star"></i>';
      }
      h += `</span> <strong class="ms-1 small">${r}.0</strong>`;
      return h;
    }

    function render() {
      const q = ($('search').value || '').toLowerCase().trim();
      const rFilter = $('ratingFilter').value;

      const filtered = allReviews.filter(r => {
        if (rFilter && String(r.rating) !== rFilter) return false;
        if (!q) return true;
        const text = [
          r.customerName || '',
          r.providerBusinessName || r.businessName || '',
          r.review || '',
          r.bookingId || '',
          r.id || ''
        ].join(' ').toLowerCase();
        return text.includes(q);
      });

      if (!filtered.length) {
        $('rows').innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No reviews match the filters.</td></tr>';
        return;
      }

      $('rows').innerHTML = filtered.map(r => {
        const dateStr = r.createdAt ? new Date(r.createdAt).toLocaleDateString('en-IN', {
          year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        }) : '—';
        const providerName = r.providerBusinessName || r.businessName || 'Provider';

        return `<tr>
          <td>
            <div>${renderStars(r.rating)}</div>
            <a href="/admin/bookings.html?search=${r.bookingId}" class="badge bg-light text-muted border text-decoration-none mt-1" title="View associated booking">
              Booking #${r.bookingId}
            </a>
          </td>
          <td>
            <div class="p-2 rounded bg-light border text-dark small" style="white-space: pre-wrap;">
              ${r.review ? esc(r.review) : '<em class="text-muted">No written comment provided.</em>'}
            </div>
          </td>
          <td>
            <strong class="d-block text-dark">${esc(providerName)}</strong>
            <span class="small text-muted">Review #${r.id}</span>
          </td>
          <td class="small">
            <div class="fw-semibold text-dark">${esc(r.customerName || 'Anonymous')}</div>
            <div class="text-muted small">${dateStr}</div>
          </td>
          <td class="text-end text-nowrap">
            <button class="btn btn-sm btn-outline-danger act-delete" data-id="${r.id}" title="Delete Review">
              <i class="bi bi-trash3 me-1"></i>Delete
            </button>
          </td>
        </tr>`;
      }).join('');
    }

    $('search').addEventListener('input', render);
    $('ratingFilter').addEventListener('change', render);
    $('refreshBtn').addEventListener('click', load);

    $('rows').addEventListener('click', async e => {
      const delBtn = e.target.closest('.act-delete');
      if (delBtn) {
        const id = Number(delBtn.dataset.id);
        if (!confirm(`Are you sure you want to delete review #${id}? The provider's average score will be automatically recalculated.`)) return;

        delBtn.disabled = true;
        try {
          await api(`/admin/reviews/${id}`, { method: 'DELETE' });
          msg(`Review #${id} deleted successfully. Provider rating has been updated.`, true);
          await load();
        } catch (err) {
          msg(err.message);
          delBtn.disabled = false;
        }
      }
    });

    if (me) load();
  </script>
</body>
</html>
