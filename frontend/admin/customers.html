<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Accounts · Local Service Connect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container-xl py-4 py-lg-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
      <div>
        <h1 class="h3 fw-bold mb-1">Customer Accounts Management</h1>
        <p class="text-muted mb-0">Monitor registered customer profiles, booking volumes, and account access permissions.</p>
      </div>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <div class="input-group input-group-sm" style="width: 240px;">
          <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
          <input type="text" id="search" class="form-control" placeholder="Search customer, email, area...">
        </div>
        <select id="statusFilter" class="form-select form-select-sm w-auto">
          <option value="">All Accounts</option>
          <option value="true">Active Only</option>
          <option value="false">Suspended Only</option>
        </select>
      </div>
    </div>

    <div id="msg" class="alert d-none"></div>

    <div class="row g-3 mb-4" id="statsRow">
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm dashboard-card p-3">
          <div class="small text-muted">Total Customers</div>
          <div class="fs-4 fw-bold text-dark" id="statTotal">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm dashboard-card p-3">
          <div class="small text-muted">Active Accounts</div>
          <div class="fs-4 fw-bold text-success" id="statActive">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm dashboard-card p-3">
          <div class="small text-muted">Suspended</div>
          <div class="fs-4 fw-bold text-danger" id="statSuspended">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm dashboard-card p-3">
          <div class="small text-muted">Total Customer Bookings</div>
          <div class="fs-4 fw-bold text-primary" id="statBookings">-</div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm dashboard-card overflow-hidden">
      <div class="table-responsive">
        <table class="table align-middle mb-0 table-hover">
          <thead class="table-light">
            <tr>
              <th style="width: 25%;">Customer</th>
              <th style="width: 22%;">Contact Info</th>
              <th style="width: 26%;">Address / Location</th>
              <th style="width: 12%;">Bookings</th>
              <th class="text-end" style="width: 15%;">Account Control</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="5" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading customers...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    const me = Auth.require('ADMIN');
    adminNav('customers');
    const $ = id => document.getElementById(id);

    let allCustomers = [];

    function msg(t, ok = false) {
      const m = $('msg');
      m.className = 'alert alert-' + (ok ? 'success' : 'danger') + ' alert-dismissible fade show';
      m.innerHTML = `${t} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
      m.classList.remove('d-none');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function load() {
      try {
        allCustomers = await api('/admin/customers') || [];
        updateStats();
        render();
      } catch (e) {
        msg(e.message);
      }
    }

    function updateStats() {
      const total = allCustomers.length;
      const active = allCustomers.filter(c => c.enabled !== false).length;
      const suspended = total - active;
      const totalBookings = allCustomers.reduce((acc, c) => acc + (c.totalBookings ?? c.bookingsCount ?? 0), 0);

      $('statTotal').textContent = total;
      $('statActive').textContent = active;
      $('statSuspended').textContent = suspended;
      $('statBookings').textContent = totalBookings;
    }

    function render() {
      const q = ($('search').value || '').toLowerCase().trim();
      const statusFilter = $('statusFilter').value;

      const filtered = allCustomers.filter(c => {
        if (statusFilter !== '' && String(c.enabled !== false) !== statusFilter) return false;
        if (!q) return true;
        const text = [
          c.name || '',
          c.email || '',
          c.phone || '',
          c.address || '',
          c.area || '',
          c.city || '',
          c.pincode || ''
        ].join(' ').toLowerCase();
        return text.includes(q);
      });

      if (!filtered.length) {
        $('rows').innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No customers found matching filters.</td></tr>';
        return;
      }

      $('rows').innerHTML = filtered.map(c => {
        const isEnabled = c.enabled !== false;
        const bookings = c.totalBookings ?? c.bookingsCount ?? 0;
        const initials = (c.name || 'C').slice(0, 2).toUpperCase();

        return `<tr>
          <td>
            <div class="d-flex align-items-center">
              <div class="rounded-circle bg-info-subtle text-info fw-bold d-flex align-items-center justify-content-center me-3" style="width: 40px; height: 40px; font-size: 0.9rem;">
                ${esc(initials)}
              </div>
              <div>
                <strong class="d-block text-dark">${esc(c.name || 'Anonymous Customer')}</strong>
                <span class="small text-muted">Customer #${c.id}</span>
              </div>
            </div>
          </td>
          <td class="small">
            <div><i class="bi bi-envelope me-1 text-muted"></i>${esc(c.email || '—')}</div>
            <div><i class="bi bi-telephone me-1 text-muted"></i>${esc(c.phone || 'No phone recorded')}</div>
          </td>
          <td class="small">
            <div class="text-truncate" style="max-width: 280px;" title="${esc(c.address || '')}">
              ${esc(c.address || 'No address set')}
            </div>
            <div class="text-muted small">
              <i class="bi bi-geo-alt me-1 text-danger"></i>${esc(c.area || '—')}${c.city ? `, ${esc(c.city)}` : ''}${c.pincode ? ` - ${esc(c.pincode)}` : ''}
            </div>
          </td>
          <td>
            <a href="/admin/bookings.html?customerId=${c.id}" class="badge bg-light text-primary border text-decoration-none p-2" title="View bookings by this customer">
              <i class="bi bi-calendar2-check me-1"></i>${bookings} bookings
            </a>
          </td>
          <td class="text-end text-nowrap">
            <div class="d-inline-block me-2 align-middle">
              ${isEnabled
                ? '<span class="badge bg-success-subtle text-success border border-success-subtle"><i class="bi bi-check-circle me-1"></i>Active</span>'
                : '<span class="badge bg-danger text-white"><i class="bi bi-slash-circle me-1"></i>Suspended</span>'}
            </div>
            <button class="btn btn-sm ${isEnabled ? 'btn-outline-danger' : 'btn-outline-success'} act-toggle" data-id="${c.id}" data-enabled="${!isEnabled}">
              <i class="bi ${isEnabled ? 'bi-lock' : 'bi-unlock'} me-1"></i>${isEnabled ? 'Suspend' : 'Reinstate'}
            </button>
          </td>
        </tr>`;
      }).join('');
    }

    $('search').addEventListener('input', render);
    $('statusFilter').addEventListener('change', render);

    $('rows').addEventListener('click', async e => {
      const toggleBtn = e.target.closest('.act-toggle');
      if (toggleBtn) {
        const id = Number(toggleBtn.dataset.id);
        const willEnable = toggleBtn.dataset.enabled === 'true';
        const c = allCustomers.find(x => x.id === id);
        const name = c ? c.name : 'this customer';

        if (!willEnable && !confirm(`Suspend account for "${name}"? The customer will be unable to log in or book services.`)) return;

        toggleBtn.disabled = true;
        try {
          await api(`/admin/customers/${id}/enabled`, {
            method: 'PUT',
            body: { enabled: willEnable }
          });
          msg(`Account for "${name}" has been ${willEnable ? 'reinstated' : 'suspended'}.`, true);
          await load();
        } catch (err) {
          msg(err.message);
          toggleBtn.disabled = false;
        }
      }
    });

    if (me) load();
  </script>
</body>
</html>
